substitutions:
  ac_brother: climate.280060372jia_daikin_ge
  ac_sister: climate.280060372jia_daikin_mei
  ac_parents: climate.280060372jia_daikin_ba_ma
  ac_living: climate.living_room_daikin_ke

# ===================================================
# ALL 4 AC MULTI-ENTITY STRING V2
# Built from known-good tab5_autorotate_OK.yaml.
# NO state-aware Quiet/Auto/Cool image switching is enabled in this build.
# Purpose: capture exact HA HVAC + fan state for all four ACs
# while preserving the last known-stable UI/runtime behavior.
#
# M5STACK TAB5 + HOME ASSISTANT AC CONTROL PANEL
# UI: 2x2 AC cards + global ALL panel
#
# Individual POWER behavior:
#   AC OFF -> tap power -> COOL + AUTO + 26.0 C
#   AC ON  -> tap power -> OFF
#
# Temperature step:
#   +/- = 0.5 C, clamped to 18.0 ... 30.0 C
#
# Global panel:
#   +/-    -> sets all four AC target temperatures
#   QUIET  -> fan mode Quiet for all
#   AUTO   -> fan mode Auto for all
#   COOL   -> HVAC mode cool for all
#   POWER  -> if all are ON, turn all OFF;
#             otherwise turn all ON as COOL/AUTO/26 C
#
# Screen:
#   20s idle -> dim to 20%
#   60s idle -> backlight OFF + LVGL paused
#   touch     -> wake to 100%
#
# Battery:
#   Small indicator at bottom of ALL column:
#   BAT xx% / CHG xx% / USB
#   >50% green, 21-50% gray, 11-20% orange, <=10% red
#   charging is always green
#
# Rotation:
#   boots immediately in preferred 90-degree landscape orientation
#   auto-rotates to the opposite landscape orientation after ~0.6s
#   of stable IMU orientation
# ===================================================

esphome:
  name: tab5
  friendly_name: M5Stack Tab5

  # Diagnostic build marker. This proves which firmware is actually running.
  on_boot:
    - priority: -100
      then:
        - logger.log:
            level: INFO
            tag: brother_debug
            format: "BUILD MARKER: ALL4_MULTI_ENTITY_STRING_V2"

esp32:
  variant: esp32p4
  flash_size: 16MB
  engineering_sample: true
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  slot: 1

logger:
  hardware_uart: USB_SERIAL_JTAG

psram:
  mode: hex
  speed: 200MHz

i2c:
  - id: bsp_bus
    sda: GPIO31
    scl: GPIO32
    frequency: 400kHz
    scan: true

# ---------------------------------------------------
# Tab5 BMI270 IMU - automatic screen orientation
# ESPHome 2026.x uses the Motion hub for BMI270.
# ---------------------------------------------------

motion:
  - platform: bmi270
    id: tab5_imu
    i2c_id: bsp_bus
    address: 0x68
    update_interval: 250ms
    accelerometer_range: 4G

pi4ioe5v6408:
  - id: pi4ioe1
    address: 0x43
  - id: pi4ioe2
    address: 0x44

switch:
  - platform: gpio
    id: wifi_power
    name: "WiFi Power"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 0
    restore_mode: ALWAYS_ON

# ---------------------------------------------------
# Tab5 charging status
# PI4IOE2 pin 6 is the charge-status input on Tab5.
# ---------------------------------------------------

binary_sensor:
  - platform: gpio
    id: charging
    name: "Tab5 Charging Status"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 6
      mode: INPUT_PULLDOWN
    on_press:
      - component.update: battery_percent
    on_release:
      - component.update: battery_percent

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome

esp_ldo:
  - id: display_ldo
    voltage: 2.5V
    channel: 3

display:
  - platform: mipi_dsi
    id: tab5_display
    model: M5Stack-Tab5
    dimensions:
      width: 720
      height: 1280
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 4
    show_test_card: false

touchscreen:
  - platform: gt911
    id: tab5_touch
    i2c_id: bsp_bus
    interrupt_pin: GPIO23
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 5
    update_interval: never
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    calibration:
      x_min: 0
      x_max: 720
      y_min: 0
      y_max: 1280

    on_release:
      - if:
          condition:
            lvgl.is_paused:
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - light.turn_on:
          id: display_backlight
          brightness: 100%
          transition_length: 0s

# ===================================================
