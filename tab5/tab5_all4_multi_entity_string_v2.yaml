# ===================================================
# GLOBAL ALL-TEMPERATURE VALUE
# ===================================================

globals:
  - id: all_target_temp
    type: float
    restore_value: false
    initial_value: '26.0'
  # Current LVGL orientation.
  # Preferred/default boot orientation is 90 degrees.
  - id: screen_rotation
    type: int
    restore_value: no
    initial_value: '90'

  # Prevent a single noisy IMU reading from flipping the screen.
  - id: rotation_candidate
    type: int
    restore_value: no
    initial_value: '90'

  - id: rotation_candidate_count
    type: int
    restore_value: no
    initial_value: '0'

  - id: rotation_pending_apply
    type: bool
    restore_value: no
    initial_value: 'false'
# ===================================================
# AUTO ROTATION
#
# Uses gravity on the BMI270 Y axis.
# Normal orientation: +Y -> 270 degrees
# Upside down:        -Y -> 90 degrees
#
# About 0.6 seconds of stable orientation prevents accidental flips
# while making rotation feel substantially more responsive.
# NOTE: if your physical unit rotates the opposite way, swap 90 and 270
# in the two 'wanted =' lines below.
# ===================================================

interval:
  # Existing autorotation loop
  - interval: 200ms
    startup_delay: 1s
    then:
      - lambda: |-
          id(rotation_pending_apply) = false;

          const float y = id(tab5_accel_y).state;
          if (isnan(y)) {
            id(rotation_candidate_count) = 0;
            return;
          }

          int wanted;

          // Ignore ambiguous orientations near the threshold.
          // The BMI270 acceleration values are expressed in g.
          if (y > 0.45f) {
            wanted = 270;
          } else if (y < -0.45f) {
            wanted = 90;
          } else {
            id(rotation_candidate_count) = 0;
            return;
          }

          // Start/restart the stability counter when the candidate changes.
          if (wanted != id(rotation_candidate)) {
            id(rotation_candidate) = wanted;
            id(rotation_candidate_count) = 1;
            return;
          }

          // Require three consecutive 200 ms samples (~0.6 second).
          if (id(rotation_candidate_count) < 3) {
            id(rotation_candidate_count)++;
            return;
          }

          // Already at the desired orientation.
          if (wanted == id(screen_rotation)) {
            return;
          }

          id(screen_rotation) = wanted;
          id(rotation_candidate_count) = 0;
          id(rotation_pending_apply) = true;

          ESP_LOGI(
            "autorotate",
            "Tab5 orientation changed -> %d degrees (accel_y=%.3f g)",
            wanted,
            y
          );

      - if:
          condition:
            lambda: 'return id(rotation_pending_apply);'
          then:
            - lvgl.display.set_rotation:
                rotation: !lambda 'return id(screen_rotation);'

  # Diagnostic heartbeat: proves the build is alive and shows all 4 cached HA values.
  - interval: 10s
    startup_delay: 10s
    then:
      - lambda: |-
          ESP_LOGI(
            "ac4_debug",
            "HEARTBEAT | Darren: hvac='%s' fan='%s' | Amber: hvac='%s' fan='%s' | PaMom: hvac='%s' fan='%s' | Living: hvac='%s' fan='%s'",
            id(brother_state).state.c_str(),
            id(brother_fan).state.c_str(),
            id(sister_state).state.c_str(),
            id(sister_fan).state.c_str(),
            id(parents_state).state.c_str(),
            id(parents_fan).state.c_str(),
            id(living_state).state.c_str(),
            id(living_fan).state.c_str()
          );

# ===================================================
# HELPER SCRIPTS
# ===================================================

script:
  # Refresh the global power icon.
  # ON image only when ALL four ACs are currently not off.
  - id: refresh_all_power_icon
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(brother_state).state != "off" &&
                     id(sister_state).state != "off" &&
                     id(parents_state).state != "off" &&
                     id(living_state).state != "off";
          then:
            - lvgl.image.update:
                id: all_power_image
                src: img_power_on
          else:
            - lvgl.image.update:
                id: all_power_image
                src: img_power_off

  - id: all_on_26
    mode: restart
    then:
      - lambda: |-
          id(all_target_temp) = 26.0f;
      - lvgl.label.update:
          id: all_target_label
          text: "26.0 C"

      # ESPHome HA action data must stay scalar/string.
      # One HA action targets all four ACs: COOL + 26 C.
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: "${ac_brother},${ac_sister},${ac_parents},${ac_living}"
            temperature: "26"
            hvac_mode: cool

      # One HA action targets all four ACs: FAN AUTO.
      - homeassistant.action:
          action: climate.set_fan_mode
          data:
            entity_id: "${ac_brother},${ac_sister},${ac_parents},${ac_living}"
            fan_mode: Auto

  - id: all_off
    mode: restart
    then:
      - homeassistant.action:
          action: climate.turn_off
          data:
            entity_id: "${ac_brother},${ac_sister},${ac_parents},${ac_living}"

