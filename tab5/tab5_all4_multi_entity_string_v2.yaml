sensor:
  # -------------------------------------------------
  # Tab5 battery / power monitor
  #
  # M5Stack's reference config uses the onboard INA226
  # at 0x41 with a 5 mOhm shunt. Positive current means
  # discharging; negative current means charging.
  # -------------------------------------------------

  - platform: ina226
    address: 0x41
    i2c_id: bsp_bus
    adc_averaging: 16
    max_current: 8.192A
    shunt_resistance: 0.005ohm
    update_interval: 10s

    bus_voltage:
      id: battery_voltage
      name: "Tab5 Battery Voltage"

    current:
      id: battery_current
      name: "Tab5 Battery Current"

  # Approximate state-of-charge from pack voltage.
  # This follows M5Stack's current Tab5 ESPHome HMI
  # reference: 6.0 V = 0%, 8.4 V = 100%.
  # It is charge level, not long-term battery health.
  - platform: template
    id: battery_percent
    name: "Tab5 Battery Percentage"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      const float voltage = id(battery_voltage).state;

      // No battery / invalid reading.
      if (isnan(voltage) || voltage < 5.0f) {
        return 0.0f;
      }

      const float min_voltage = 6.0f;
      const float max_voltage = 8.4f;

      if (voltage <= min_voltage) return 0.0f;
      if (voltage >= max_voltage) return 100.0f;

      return ((voltage - min_voltage) / (max_voltage - min_voltage)) * 100.0f;

    on_value:
      then:
        # Update the battery/charging text.
        - lvgl.label.update:
            id: battery_status_label
            text: !lambda |-
              static char buf[24];

              const float voltage = id(battery_voltage).state;
              const float current = id(battery_current).state;
              const bool is_charging =
                  id(charging).state ||
                  (!isnan(current) && current < -0.1f);

              if (isnan(voltage) || voltage < 5.0f) {
                snprintf(buf, sizeof(buf), "USB");
              } else if (is_charging) {
                snprintf(buf, sizeof(buf), "CHG %.0f%%", x);
              } else {
                snprintf(buf, sizeof(buf), "BAT %.0f%%", x);
              }

              return buf;

        # Dynamic battery color:
        #   Charging       -> green
        #   51-100%        -> green
        #   21-50%         -> light gray
        #   11-20%         -> orange
        #   0-10%          -> red
        #   USB/no battery -> gray
        - if:
            condition:
              lambda: |-
                const float voltage = id(battery_voltage).state;
                const float current = id(battery_current).state;
                return !isnan(voltage) && voltage >= 5.0f &&
                       (id(charging).state ||
                        (!isnan(current) && current < -0.1f));
            then:
              - lvgl.label.update:
                  id: battery_status_label
                  text_color: 0x4CAF50
            else:
              - if:
                  condition:
                    lambda: |-
                      const float voltage = id(battery_voltage).state;
                      return isnan(voltage) || voltage < 5.0f;
                  then:
                    - lvgl.label.update:
                        id: battery_status_label
                        text_color: 0x9E9E9E
                  else:
                    - if:
                        condition:
                          lambda: 'return id(battery_percent).state > 50.0f;'
                        then:
                          - lvgl.label.update:
                              id: battery_status_label
                              text_color: 0x4CAF50
                        else:
                          - if:
                              condition:
                                lambda: 'return id(battery_percent).state > 20.0f;'
                              then:
                                - lvgl.label.update:
                                    id: battery_status_label
                                    text_color: 0xD0D0D0
                              else:
                                - if:
                                    condition:
                                      lambda: 'return id(battery_percent).state > 10.0f;'
                                    then:
                                      - lvgl.label.update:
                                          id: battery_status_label
                                          text_color: 0xFF9800
                                    else:
                                      - lvgl.label.update:
                                          id: battery_status_label
                                          text_color: 0xF44336

  # -------------------------------------------------
  # BMI270 motion outputs used by auto-rotation
  # -------------------------------------------------

  - platform: motion
    motion_id: tab5_imu
    type: acceleration_x
    id: tab5_accel_x
    internal: true

  - platform: motion
    motion_id: tab5_imu
    type: acceleration_y
    id: tab5_accel_y
    internal: true

  - platform: motion
    motion_id: tab5_imu
    type: acceleration_z
    id: tab5_accel_z
    internal: true

  # -------------------------------------------------
  # Home Assistant AC temperatures
  # -------------------------------------------------

  # DARREN
  - platform: homeassistant
    id: brother_current_temp
    entity_id: ${ac_brother}
    attribute: current_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: brother_room_label
            text:
              format: "Room %.1f C"
              args: [x]
              if_nan: "Room --"

  - platform: homeassistant
    id: brother_target_temp
    entity_id: ${ac_brother}
    attribute: temperature
    on_value:
      then:
        - lvgl.label.update:
            id: brother_target_label
            text:
              format: "%.1f C"
              args: [x]
              if_nan: "--"

  # AMBER
  - platform: homeassistant
    id: sister_current_temp
    entity_id: ${ac_sister}
    attribute: current_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: sister_room_label
            text:
              format: "Room %.1f C"
              args: [x]
              if_nan: "Room --"

  - platform: homeassistant
    id: sister_target_temp
    entity_id: ${ac_sister}
    attribute: temperature
    on_value:
      then:
        - lvgl.label.update:
            id: sister_target_label
            text:
              format: "%.1f C"
              args: [x]
              if_nan: "--"

  # PA & MOM
  - platform: homeassistant
    id: parents_current_temp
    entity_id: ${ac_parents}
    attribute: current_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: parents_room_label
            text:
              format: "Room %.1f C"
              args: [x]
              if_nan: "Room --"

  - platform: homeassistant
    id: parents_target_temp
    entity_id: ${ac_parents}
    attribute: temperature
    on_value:
      then:
        - lvgl.label.update:
            id: parents_target_label
            text:
              format: "%.1f C"
              args: [x]
              if_nan: "--"

  # LIVING
  - platform: homeassistant
    id: living_current_temp
    entity_id: ${ac_living}
    attribute: current_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: living_room_label
            text:
              format: "Room %.1f C"
              args: [x]
              if_nan: "Room --"

  - platform: homeassistant
    id: living_target_temp
    entity_id: ${ac_living}
    attribute: temperature
    on_value:
      then:
        - lvgl.label.update:
            id: living_target_label
            text:
              format: "%.1f C"
              args: [x]
              if_nan: "--"

# ===================================================
# LVGL UI
# Effective screen after rotation: 1280 x 720
# Background color sampled from background.png: #2E2E2E
# ===================================================

lvgl:
  displays:
    - tab5_display

  rotation: 90
  disp_bg_color: 0x2E2E2E
  disp_bg_opa: COVER
  default_font: montserrat_18

  touchscreens:
    - touchscreen_id: tab5_touch

  on_idle:
    - timeout: 20s
      then:
        - light.turn_on:
            id: display_backlight
            brightness: 20%
            transition_length: 500ms

    - timeout: 60s
      then:
        - light.turn_off:
            id: display_backlight
            transition_length: 500ms
        - lvgl.pause:

  pages:
    - id: main_page
      bg_color: 0x2E2E2E
      bg_opa: COVER
      widgets:

        # =================================================
        # ALL PANEL
        # =================================================
        - obj:
            x: 10
            y: 10
            width: 160
            height: 700
            bg_color: 0x2E2E2E
            bg_opa: COVER
            border_color: 0xA8A8A8
            border_width: 1
            radius: 0
            pad_all: 0
            widgets:
              - label:
                  align: TOP_MID
                  y: 16
                  text: "ALL"
                  text_font: montserrat_22
                  text_color: 0xE0E0E0

              - button:
                  align: TOP_MID
                  y: 62
                  width: 72
                  height: 72
                  bg_opa: TRANSP
                  border_opa: TRANSP
                  shadow_opa: TRANSP
                  widgets:
                    - image:
                        align: CENTER
                        src: img_plus
                  on_click:
                    - lambda: |-
                        id(all_target_temp) = std::min(30.0f, id(all_target_temp) + 0.5f);
                    - lvgl.label.update:
                        id: all_target_label
                        text:
                          format: "%.1f C"
                          args: [id(all_target_temp)]
                    - homeassistant.action:
                        action: climate.set_temperature
                        data:
                          entity_id: "${ac_brother},${ac_sister},${ac_parents},${ac_living}"
                          temperature: !lambda 'return id(all_target_temp);'

              - label:
                  id: all_target_label
                  align: TOP_MID
