                    id(settings_open) = false;
                    lv_obj_add_flag(id(settings_panel), LV_OBJ_FLAG_HIDDEN);
              - homeassistant.event:
                  event: esphome.tab5_command
                  data: { action: "open_tab", tab: "amber" }
        - button:
            id: tab_gas_button
            x: 510
            y: 10
            width: 96
            height: 112
            styles: mono_button
            widgets: [ { image: { align: CENTER, src: img_tab_gas } } ]
            on_click:
              - lambda: |-
                    const lv_color_t normal = lv_color_hex(id(theme_bg));
                    const lv_color_t selected = lv_color_hex(id(theme_selected));
                    lv_obj_set_style_bg_color(id(tab_all_button), normal, LV_PART_MAIN);
                    lv_obj_set_style_bg_color(id(tab_parents_button), normal, LV_PART_MAIN);
