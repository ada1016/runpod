                        then:
                          - homeassistant.event:
                              event: esphome.tab5_command
                              data_template:
                                action: "gas_submit"
                                value: "{{ pin }}"
                              variables:
                                pin: !lambda 'return id(gas_pin);'

              # ------------------------------------------------
              # Bottom submission console
              # ------------------------------------------------
              - obj:
                  x: 25
                  y: 700
                  width: 602
                  height: 255
                  bg_color: 0xF5F5F2
                  bg_opa: COVER
                  border_color: 0x333333
                  border_width: 2
                  radius: 8
                  pad_all: 12
                  widgets:

                    - label:
                        x: 0
                        y: 0
                        text: "SUBMISSION STATUS"
                        text_font: montserrat_18
                        text_color: 0x555555

                    - label:
                        id: gas_status_label
                        x: 0
                        y: 28
                        width: 250
                        text: "ready"
                        text_font: montserrat_26
                        text_color: 0x111111

                    - label:
                        id: gas_result_label
                        x: 275
                        y: 8
                        width: 295
                        height: 112
                        text: "Ready for meter reading"
                        text_font: montserrat_16
                        text_color: 0x222222
                        long_mode: WRAP

                    - obj:
                        x: 0
                        y: 125
                        width: 570
                        height: 102
                        bg_color: 0xE7E7E4
                        bg_opa: COVER
                        border_opa: TRANSP
                        radius: 4
                        pad_all: 8
                        widgets:
                          - label:
                              id: gas_log_label
                              x: 0
                              y: 0
                              width: 552
                              height: 86
                              text: "Backend ready"
                              text_font: montserrat_16
                              text_color: 0x333333
                              long_mode: WRAP

# ============================================================
# LCD BACKLIGHT
# ============================================================
output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO22
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: display_backlight
    name: "Tab5 Display Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON
