# ============================================================
# M5Stack Tab5 - Mono Home Controller Prototype
# First tab only, based on the user's Figma layout.
#
# Architecture:
#   Tab5 -> ONE Home Assistant event stream (esphome.tab5_command)
#   AppDaemon -> controls real HA devices
#   AppDaemon -> ONE aggregate state entity:
#                sensor.tab5_first_tab_bridge
#   Tab5 -> ONE HA text_sensor listener for the entire first tab
#
# This intentionally avoids one ESPHome listener per device.
#
# FONT FILE REQUIRED LOCALLY:
#   fonts/fa-solid-900.ttf
# Use the free Font Awesome Solid TTF you already have.
# ============================================================

esphome:
  name: tab5
  friendly_name: M5Stack Tab5
  on_boot:
    - priority: -100
      then:
        - logger.log:
            level: INFO
            tag: ui
            format: "BUILD MARKER: THEME_SWITCHES_SLIDERS_V6"
        - delay: 2s
        - script.execute:
            id: apply_theme
            theme: !lambda 'return id(theme_index);'

esp32:
  variant: esp32p4
  flash_size: 16MB
  engineering_sample: true
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  slot: 1

logger:
  hardware_uart: USB_SERIAL_JTAG

psram:
  mode: hex
  speed: 200MHz

i2c:
  - id: bsp_bus
    sda: GPIO31
    scl: GPIO32
    frequency: 400kHz
    scan: true

pi4ioe5v6408:
  - id: pi4ioe1
    address: 0x43
  - id: pi4ioe2
    address: 0x44

switch:
  - platform: gpio
    id: wifi_power
    name: "WiFi Power"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 0
    restore_mode: ALWAYS_ON

  - platform: gpio
    id: charge_enable
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 7
    restore_mode: ALWAYS_ON
    internal: true

  - platform: gpio
    id: tab5_poweroff_pulse
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 4
    restore_mode: ALWAYS_OFF
    internal: true

binary_sensor:
  - platform: gpio
    id: charging
    name: "Tab5 Charging Status"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 6
      mode: INPUT_PULLDOWN
    on_press:
      - component.update: battery_percent
    on_release:
      - component.update: battery_percent
    on_state:
      then:
        - if:
            condition:
              binary_sensor.is_on: charging
            then:
              - lvgl.widget.show: battery_charging_anim
              - lvgl.widget.hide: battery_level_image
            else:
              - lvgl.widget.hide: battery_charging_anim
              - lvgl.widget.show: battery_level_image

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome

esp_ldo:
  - id: display_ldo
    voltage: 2.5V
    channel: 3

display:
  - platform: mipi_dsi
    id: tab5_display
    model: M5Stack-Tab5
    dimensions:
      width: 720
      height: 1280
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 4
    show_test_card: false

touchscreen:
  - platform: gt911
    id: tab5_touch
    i2c_id: bsp_bus
    interrupt_pin: GPIO23
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 5
    update_interval: never
    calibration:
      x_min: 0
      x_max: 720
      y_min: 0
      y_max: 1280
    on_release:
      - if:
          condition:
            lvgl.is_paused:
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - light.turn_on:
          id: display_backlight
          brightness: 100%
          transition_length: 0s

