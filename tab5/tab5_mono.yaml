# ============================================================
# LOCAL STATE
# ============================================================
globals:
  # Prevent AppDaemon -> UI synchronization from emitting commands back.
  - id: syncing_ui
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: gas_pin
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: gas_submitting
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: last_gas_message
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: gas_log_buffer
    type: std::string
    restore_value: no
    initial_value: '""'

  # Runtime theme selection. Theme 0 is the current mono palette.
  - id: theme_index
    type: int
    restore_value: yes
    initial_value: '0'

  - id: theme_bg
    type: uint32_t
    restore_value: no
    initial_value: '0xECECEA'

  - id: theme_selected
    type: uint32_t
    restore_value: no
    initial_value: '0xD8D8D8'

  - id: settings_open
    type: bool
    restore_value: no
    initial_value: 'false'

# ============================================================
# APPDAEMON DYNAMIC MULTI-TAB BRIDGE
# ONE HA listener only: sensor.tab5_ui_bridge
# ============================================================
text_sensor:
  - platform: homeassistant
    id: ui_bridge
    entity_id: sensor.tab5_ui_bridge
    on_value:
      then:
        - lambda: |-
            id(syncing_ui) = true;
            std::string s = x;
            std::string f[32];
            int field = 0;
            size_t start = 0;
            while (field < 32) {
              size_t p = s.find('|', start);
              if (p == std::string::npos) {
                f[field++] = s.substr(start);
                break;
              }
              f[field++] = s.substr(start, p - start);
              start = p + 1;
            }
            if (field < 32) {
              ESP_LOGW("ui_bridge", "Malformed payload: %s", s.c_str());
              id(syncing_ui) = false;
              return;
            }

            const bool gas = (f[0] == "gas");

            // -------------------------------------------------
            // SETTINGS / XIAOMI HOME RECOVERY STATUS
            //
            // These fields are always present, regardless of which
            // room AppDaemon currently publishes:
            // 29 unavailable device count
            // 30 recovery state: ok / needs_reload / reloading
            // 31 human-readable recovery message
            // -------------------------------------------------
            const std::string recovery_state = f[30];
            const std::string recovery_message = f[31];

            if (!recovery_message.empty()) {
              lv_label_set_text(
                id(device_recovery_message),
                recovery_message.c_str()
              );
            }

            if (recovery_state == "reloading") {
              lv_obj_add_state(
                id(xiaomi_reload_button),
                LV_STATE_DISABLED
              );
            } else {
              lv_obj_clear_state(
                id(xiaomi_reload_button),
                LV_STATE_DISABLED
              );
            }

            // -------------------------------------------------
            // TOP TAB VISUAL SELECTION
            // Runtime colors follow the selected theme.
            // -------------------------------------------------
            const lv_color_t tab_normal = lv_color_hex(id(theme_bg));
            const lv_color_t tab_selected = lv_color_hex(id(theme_selected));

            if (id(settings_open)) {
              // Keep the local Settings page visible even if a watched
              // HA entity changes in the background.
              id(syncing_ui) = false;
              return;
            }

            lv_obj_set_style_bg_color(id(tab_all_button),      tab_normal, LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(tab_parents_button),  tab_normal, LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(tab_darren_button),   tab_normal, LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(tab_amber_button),    tab_normal, LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(tab_gas_button),      tab_normal, LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(tab_settings_button), tab_normal, LV_PART_MAIN);

            if (f[0] == "all") {
              lv_obj_set_style_bg_color(id(tab_all_button), tab_selected, LV_PART_MAIN);
            } else if (f[0] == "parents") {
              lv_obj_set_style_bg_color(id(tab_parents_button), tab_selected, LV_PART_MAIN);
            } else if (f[0] == "darren") {
              lv_obj_set_style_bg_color(id(tab_darren_button), tab_selected, LV_PART_MAIN);
            } else if (f[0] == "amber") {
              lv_obj_set_style_bg_color(id(tab_amber_button), tab_selected, LV_PART_MAIN);
            } else if (f[0] == "gas") {
              lv_obj_set_style_bg_color(id(tab_gas_button), tab_selected, LV_PART_MAIN);
            }

            if (gas) {
              lv_obj_add_flag(id(ac_panel), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(light_grid), LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(gas_panel), LV_OBJ_FLAG_HIDDEN);

              const std::string gas_status = f[22];
              const std::string gas_message = f[23];
              const std::string gas_reading = f[24];
              const std::string company_date = f[25];
              const std::string company_reading = f[26];
              const bool confirmation = (f[27] == "1");
              const bool history_ok = (f[28] == "1");

              id(gas_submitting) = (
                gas_status == "submitting"
              );

              if (id(gas_submitting)) {
                lv_obj_add_state(
                  id(gas_submit_button),
                  LV_STATE_DISABLED
                );
              } else {
                lv_obj_clear_state(
                  id(gas_submit_button),
                  LV_STATE_DISABLED
                );
              }

              // Current status heading.
              lv_label_set_text(
                id(gas_status_label),
                gas_status.empty()
                  ? "READY"
                  : gas_status.c_str()
              );

              // Append only NEW backend messages to a small local
              // rolling console. This keeps the HA bridge compact.
              if (
                !gas_message.empty()
                && gas_message != id(last_gas_message)
              ) {
                id(last_gas_message) = gas_message;

                if (!id(gas_log_buffer).empty()) {
                  id(gas_log_buffer) += "\n";
                }

                id(gas_log_buffer) += gas_message;

                // Keep roughly the last 4 lines.
                int lines = 1;
                for (char c : id(gas_log_buffer)) {
                  if (c == '\n') lines++;
                }

                while (lines > 4) {
                  const size_t pos = (
                    id(gas_log_buffer).find('\n')
                  );

                  if (pos == std::string::npos) {
                    break;
                  }

                  id(gas_log_buffer).erase(
                    0,
                    pos + 1
                  );

                  lines--;
                }

                lv_label_set_text(
                  id(gas_log_label),
                  id(gas_log_buffer).c_str()
                );
              }

              char result[192];

              if (gas_status == "success") {
                snprintf(
                  result,
                  sizeof(result),
                  "Reading: %s\nCompany: %s\nDate: %s\nConfirm: %s  History: %s",
                  gas_reading.c_str(),
                  company_reading.empty()
                    ? "--"
                    : company_reading.c_str(),
                  company_date.empty()
                    ? "--"
                    : company_date.c_str(),
                  confirmation ? "YES" : "NO",
                  history_ok ? "YES" : "NO"
                );
              } else if (
                gas_status == "failed"
                || gas_status == "error"
                || gas_status == "invalid"
              ) {
                snprintf(
                  result,
                  sizeof(result),
                  "Reading: %s\nResult: %s\n%s",
                  gas_reading.empty()
                    ? "--"
                    : gas_reading.c_str(),
                  gas_status.c_str(),
                  gas_message.c_str()
                );
              } else if (gas_status == "submitting") {
                snprintf(
                  result,
                  sizeof(result),
                  "Reading: %s\nSubmission in progress...",
                  gas_reading.empty()
                    ? "--"
                    : gas_reading.c_str()
                );
              } else {
                snprintf(
                  result,
                  sizeof(result),
                  "Ready for meter reading"
                );
              }

              lv_label_set_text(
                id(gas_result_label),
                result
              );

            } else {
              lv_obj_clear_flag(id(ac_panel), LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(light_grid), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(gas_panel), LV_OBJ_FLAG_HIDDEN);

              char buf[48];
              snprintf(buf, sizeof(buf), "%s -- %s", f[1].c_str(), f[2].c_str());
              lv_label_set_text(id(ac_mode_label), buf);
              snprintf(buf, sizeof(buf), "%s °C", f[3].c_str());
              lv_label_set_text(id(ac_target_label), buf);
              snprintf(buf, sizeof(buf), "%s°c", f[4].c_str());
              lv_label_set_text(id(room_temp_label), buf);
              snprintf(buf, sizeof(buf), "%s%%", f[5].c_str());
              lv_label_set_text(id(humidity_label), buf);
            }

            auto sync_slot = [&](lv_obj_t *card, lv_obj_t *icon_label,
                                 lv_obj_t *name_label, lv_obj_t *sw,
                                 lv_obj_t *slider, const std::string &name,
                                 const std::string &type, const std::string &on,
                                 const std::string &bri) {
              if (type.empty() || type == "none") {
                lv_obj_add_flag(card, LV_OBJ_FLAG_HIDDEN);
                return;
              }

              lv_obj_clear_flag(card, LV_OBJ_FLAG_HIDDEN);
              lv_label_set_text(name_label, name.c_str());

              // Use the dedicated light-group icon for AppDaemon
              // slots whose type is "light_group". Ordinary lights
              // continue to use the single-light icon.
              if (type == "light_group") {
                lv_label_set_text(icon_label, "\U000FFF76");
              } else {
                lv_label_set_text(icon_label, "\U0000F02A");
              }

              if (on == "1") lv_obj_add_state(sw, LV_STATE_CHECKED);
              else lv_obj_clear_state(sw, LV_STATE_CHECKED);

              int b = atoi(bri.c_str());
              if (b < 0) b = 0;
              if (b > 100) b = 100;
              lv_slider_set_value(slider, b, LV_ANIM_OFF);
            };

            if (!gas) {
              sync_slot(id(slot0_card), id(slot0_icon), id(slot0_name), id(slot0_switch), id(slot0_slider), f[6],  f[7],  f[8],  f[9]);
              sync_slot(id(slot1_card), id(slot1_icon), id(slot1_name), id(slot1_switch), id(slot1_slider), f[10], f[11], f[12], f[13]);
              sync_slot(id(slot2_card), id(slot2_icon), id(slot2_name), id(slot2_switch), id(slot2_slider), f[14], f[15], f[16], f[17]);
              sync_slot(id(slot3_card), id(slot3_icon), id(slot3_name), id(slot3_switch), id(slot3_slider), f[18], f[19], f[20], f[21]);
            }
            id(syncing_ui) = false;

# ============================================================
# LOCAL BATTERY
# ============================================================
sensor:
  - platform: ina226
    address: 0x41
    i2c_id: bsp_bus
    adc_averaging: 16
    max_current: 8.192A
    shunt_resistance: 0.005ohm
    update_interval: 10s

    bus_voltage:
      id: battery_voltage
      name: "Tab5 Battery Voltage"

    current:
      id: battery_current
      name: "Tab5 Battery Current"

  - platform: template
    id: battery_percent
    name: "Tab5 Battery Percentage"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      const float v = id(battery_voltage).state;
      if (isnan(v) || v < 5.0f) return 0.0f;
      if (v <= 6.0f) return 0.0f;
      if (v >= 8.4f) return 100.0f;
      return ((v - 6.0f) / 2.4f) * 100.0f;
    on_value:
      then:
        - lvgl.image.update:
            id: battery_level_image
            src: !lambda |-
              if (x >= 95) return id(batt_full);
              if (x >= 85) return id(batt_90);
              if (x >= 75) return id(batt_80);
              if (x >= 65) return id(batt_70);
              if (x >= 55) return id(batt_60);
              if (x >= 45) return id(batt_50);
              if (x >= 35) return id(batt_40);
              if (x >= 25) return id(batt_30);
              if (x >= 15) return id(batt_20);
              if (x >= 5) return id(batt_10);
              return id(batt_empty);
        - lvgl.label.update:
            id: battery_percent_label
            text: !lambda |-
              static char buf[8];
              snprintf(buf, sizeof(buf), "%.0f%%", x);
              return buf;

# ============================================================
# TAB5 HARDWARE OFF
# ============================================================
script:
  - id: tab5_hardware_power_off
    mode: single
    then:
      - light.turn_off:
          id: display_backlight
          transition_length: 100ms
      - delay: 150ms
      - switch.turn_on: tab5_poweroff_pulse
      - delay: 100ms
      - switch.turn_off: tab5_poweroff_pulse
      - delay: 100ms
      - switch.turn_on: tab5_poweroff_pulse
      - delay: 100ms
      - switch.turn_off: tab5_poweroff_pulse
      - delay: 100ms
      - switch.turn_on: tab5_poweroff_pulse
      - delay: 100ms
      - switch.turn_off: tab5_poweroff_pulse

  # ----------------------------------------------------------
  # Runtime theme engine
  #
  # Theme 0 = MONO (exact colors from the original YAML)
  # Theme 1 = WARM
  # Theme 2 = OCEAN
  # Theme 3 = DARK
  #
  # It walks the complete LVGL object tree and remaps every
  # background, border and text color that belongs to the
  # original 16-color palette. PNG artwork is intentionally
  # untouched.
  # ----------------------------------------------------------
  - id: apply_theme
    mode: restart
    parameters:
      theme: int
    then:
      - lambda: |-
          int t = theme;
          if (t < 0 || t > 3) t = 0;

          static const uint32_t palette[4][16] = {
            // MONO - exact colors already used by this YAML
            {
              0x111111, 0x222222, 0x333333, 0x444444,
              0x555555, 0x6F6F6F, 0x777777, 0x949494,
              0xBEBEBE, 0xC8C8C8, 0xD8D8D8, 0xE7E7E4,
              0xE7E7E7, 0xECECEA, 0xF5F5F2, 0xF7F7F4
            },

            // WARM - parchment / amber / brown
            {
              0x3B2A21, 0x51392D, 0x684B3B, 0x7B5C49,
              0x8C6B56, 0xA77B5D, 0x9A7966, 0xB99577,
              0xD2B69A, 0xDEC3A8, 0xE8D4BE, 0xF1E2D2,
              0xF3E4D5, 0xF7EFE6, 0xFCF7F1, 0xFFFAF5
            },

            // OCEAN - cool blue / cyan
            {
              0x102A43, 0x173F5F, 0x1E5573, 0x2C6784,
              0x3A7994, 0x4F91A7, 0x5D8EA3, 0x79AFC0,
              0xA4CBD6, 0xB5D8E1, 0xCBE5EA, 0xDCEFF2,
              0xE2F2F4, 0xEAF6F8, 0xF3FAFB, 0xF8FDFD
            },

            // DARK - graphite with warm CCT accents
            {
              0xF2F4F5, 0xD9DDE0, 0xC0C7CC, 0xAAB3BA,
              0x929DA5, 0x9A6B47, 0x7F8A92, 0xB7865E,
              0xD2AE8D, 0x4A4F53, 0x34383B, 0x2B2E31,
              0xE2C7AD, 0x17191B, 0x222529, 0xF8F8F8
            }
          };

          const int old_t = id(theme_index);
          const uint32_t *oldp = palette[(old_t >= 0 && old_t <= 3) ? old_t : 0];
          const uint32_t *newp = palette[t];

          auto remap = [&](lv_color_t c) -> lv_color_t {
            for (int i = 0; i < 16; i++) {
              if (lv_color_eq(c, lv_color_hex(oldp[i]))) {
                return lv_color_hex(newp[i]);
              }
            }
            return c;
          };

          // Iterative traversal avoids recursion depth concerns.
          std::vector<lv_obj_t *> stack;
          // mono_home is an ESPHome LvPageType wrapper, not lv_obj_t*.
          // Start from the first real top-level LVGL object instead.
          stack.push_back(lv_screen_active());

          while (!stack.empty()) {
            lv_obj_t *obj = stack.back();
            stack.pop_back();

            const lv_part_t parts[] = {
              LV_PART_MAIN,
              LV_PART_INDICATOR,
              LV_PART_KNOB
            };

            for (lv_part_t part : parts) {
              const lv_color_t bg = lv_obj_get_style_bg_color(obj, part);
              const lv_color_t border = lv_obj_get_style_border_color(obj, part);
              const lv_color_t txt = lv_obj_get_style_text_color(obj, part);

              lv_obj_set_style_bg_color(obj, remap(bg), part);
              lv_obj_set_style_border_color(obj, remap(border), part);
              lv_obj_set_style_text_color(obj, remap(txt), part);
            }

            const uint32_t child_count = lv_obj_get_child_count(obj);
            for (uint32_t i = 0; i < child_count; i++) {
              lv_obj_t *child = lv_obj_get_child(obj, i);
              if (child != nullptr) stack.push_back(child);
            }
          }

          id(theme_index) = t;
          id(theme_bg) = newp[13];       // original 0xECECEA
          id(theme_selected) = newp[10]; // original 0xD8D8D8

          const char *name = "MONO";
          if (t == 1) name = "WARM";
          else if (t == 2) name = "OCEAN";
          else if (t == 3) name = "DARK";

          lv_label_set_text(id(current_theme_label), name);

          // Dedicated theme-aware icon role.
          // Font-based functional icons follow the theme; PNG navigation
          // artwork and battery images intentionally retain their originals.
          static const uint32_t icon_colors[4] = {
            0x111111,  // MONO
            0x684B3B,  // WARM
            0x1E5573,  // OCEAN
            0xF2F4F5   // DARK
          };
          const lv_color_t icon_color = lv_color_hex(icon_colors[t]);

          lv_obj_set_style_text_color(id(settings_nav_icon),   icon_color, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(settings_title_icon), icon_color, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(settings_reload_icon), icon_color, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(ac_unit_icon),        icon_color, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(ac_plus_icon),        icon_color, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(ac_minus_icon),       icon_color, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(humidity_icon),       icon_color, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(room_temp_icon),      icon_color, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(ac_auto_icon),        icon_color, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(ac_quiet_icon),       icon_color, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(ac_power_icon),       icon_color, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(slot0_icon),          icon_color, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(slot1_icon),          icon_color, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(slot2_icon),          icon_color, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(slot3_icon),          icon_color, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(gas_meter_icon),      icon_color, LV_PART_MAIN);

          // ---------------------------------------------------
          // THEME-AWARE LVGL SWITCHES
          //
          // LVGL has its own checked-state indicator style. If we
          // only remap the base object colors, the built-in checked
          // style can remain blue. Explicitly style MAIN, KNOB and
          // the CHECKED INDICATOR for every switch used by this UI.
          // ---------------------------------------------------
          static const uint32_t switch_off_colors[4] = {
            0xC8C8C8,  // MONO
            0xDEC3A8,  // WARM
            0xB5D8E1,  // OCEAN
            0x4A4F53   // DARK
          };

          static const uint32_t switch_on_colors[4] = {
            0x111111,  // MONO
            0x684B3B,  // WARM
            0x1E5573,  // OCEAN
            0xD2AE8D   // DARK
          };

          static const uint32_t switch_knob_colors[4] = {
            0xF7F7F4,  // MONO
            0xFFFAF5,  // WARM
            0xF8FDFD,  // OCEAN
            0xF8F8F8   // DARK
          };

          const lv_color_t switch_off =
              lv_color_hex(switch_off_colors[t]);
          const lv_color_t switch_on =
              lv_color_hex(switch_on_colors[t]);
          const lv_color_t switch_knob =
              lv_color_hex(switch_knob_colors[t]);

          auto theme_switch = [&](lv_obj_t *sw) {
            // OFF track
            lv_obj_set_style_bg_color(
              sw,
              switch_off,
              LV_PART_MAIN | LV_STATE_DEFAULT
            );

            // ON track/indicator. Explicit LV_STATE_CHECKED is what
            // prevents LVGL's default blue checked color from winning.
            lv_obj_set_style_bg_color(
              sw,
              switch_on,
              LV_PART_INDICATOR | LV_STATE_CHECKED
            );

            // Also set the base indicator for consistency while LVGL
            // transitions between states.
            lv_obj_set_style_bg_color(
              sw,
              switch_on,
              LV_PART_INDICATOR | LV_STATE_DEFAULT
            );

            // Knob in both OFF and ON states.
            lv_obj_set_style_bg_color(
              sw,
              switch_knob,
              LV_PART_KNOB | LV_STATE_DEFAULT
            );
            lv_obj_set_style_bg_color(
              sw,
              switch_knob,
              LV_PART_KNOB | LV_STATE_CHECKED
            );

            lv_obj_invalidate(sw);
          };

          theme_switch(id(slot0_switch));
          theme_switch(id(slot1_switch));
          theme_switch(id(slot2_switch));
          theme_switch(id(slot3_switch));

          // ---------------------------------------------------
          // THEME-AWARE LVGL SLIDERS
          //
          // MAIN      = unfilled track
          // INDICATOR = filled/value portion
          // KNOB      = draggable handle
          // ---------------------------------------------------
          static const uint32_t slider_track_colors[4] = {
            0xD8D8D8,  // MONO
            0xE8D4BE,  // WARM
            0xCBE5EA,  // OCEAN
            0x4A4F53   // DARK
          };

          static const uint32_t slider_fill_colors[4] = {
            0x111111,  // MONO
            0x684B3B,  // WARM
            0x1E5573,  // OCEAN
            0xD2AE8D   // DARK
          };

          static const uint32_t slider_knob_colors[4] = {
            0x111111,  // MONO
            0x684B3B,  // WARM
            0x1E5573,  // OCEAN
            0xD2AE8D   // DARK
          };

          const lv_color_t slider_track =
              lv_color_hex(slider_track_colors[t]);
          const lv_color_t slider_fill =
              lv_color_hex(slider_fill_colors[t]);
          const lv_color_t slider_knob =
              lv_color_hex(slider_knob_colors[t]);

          auto theme_slider = [&](lv_obj_t *slider) {
            lv_obj_set_style_bg_color(
              slider,
              slider_track,
              LV_PART_MAIN | LV_STATE_DEFAULT
            );
            lv_obj_set_style_bg_color(
              slider,
              slider_fill,
              LV_PART_INDICATOR | LV_STATE_DEFAULT
            );
            lv_obj_set_style_bg_color(
              slider,
              slider_knob,
              LV_PART_KNOB | LV_STATE_DEFAULT
            );
            lv_obj_invalidate(slider);
          };

          theme_slider(id(slot0_slider));
          theme_slider(id(slot1_slider));
          theme_slider(id(slot2_slider));
          theme_slider(id(slot3_slider));

          // Keep a clear selection indicator on the four theme buttons.
          lv_obj_set_style_border_width(id(theme_mono_button),  t == 0 ? 5 : 2, LV_PART_MAIN);
          lv_obj_set_style_border_width(id(theme_warm_button),  t == 1 ? 5 : 2, LV_PART_MAIN);
          lv_obj_set_style_border_width(id(theme_ocean_button), t == 2 ? 5 : 2, LV_PART_MAIN);
          lv_obj_set_style_border_width(id(theme_dark_button),  t == 3 ? 5 : 2, LV_PART_MAIN);

          // Re-assert the currently selected top tab.
          const lv_color_t normal = lv_color_hex(id(theme_bg));
          const lv_color_t selected = lv_color_hex(id(theme_selected));

          lv_obj_set_style_bg_color(id(tab_all_button),      normal, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(tab_parents_button),  normal, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(tab_darren_button),   normal, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(tab_amber_button),    normal, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(tab_gas_button),      normal, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(tab_settings_button), normal, LV_PART_MAIN);

          if (id(settings_open)) {
            lv_obj_set_style_bg_color(id(tab_settings_button), selected, LV_PART_MAIN);
          }

          lv_obj_invalidate(lv_screen_active());

# ============================================================
# LVGL - PORTRAIT 720 x 1280
#
# Deliberately monochrome/e-paper visual language:
# background  : off-white
# primary     : black
# secondary   : medium gray
# controls    : light gray
#
# The actual Tab5 remains an LCD; this is an e-paper-style theme.
# ============================================================

lvgl:
  displays:
    - tab5_display
  rotation: 0
  disp_bg_color: 0xECECEA
  disp_bg_opa: COVER
  default_font: montserrat_18
  touchscreens:
    - touchscreen_id: tab5_touch

  on_idle:
    - timeout: 20s
      then:
        - light.turn_on:
            id: display_backlight
            brightness: 20%
            transition_length: 400ms
    - timeout: 60s
      then:
        - light.turn_off:
            id: display_backlight
            transition_length: 400ms
        - lvgl.pause:

  style_definitions:
    - id: mono_panel
      bg_color: 0xECECEA
      bg_opa: COVER
      border_color: 0x333333
      border_width: 3
      radius: 8
      pad_all: 0
    - id: mono_button
      bg_color: 0xECECEA
      bg_opa: COVER
      border_color: 0x222222
      border_width: 2
      radius: 8
      shadow_opa: TRANSP
      text_color: 0x111111
    - id: keypad_button
      bg_color: 0xF5F5F2
      bg_opa: COVER
      border_color: 0x222222
      border_width: 2
      radius: 10
      shadow_opa: TRANSP
      text_color: 0x111111

  pages:
    - id: mono_home
      bg_color: 0xECECEA
      bg_opa: COVER
      widgets:
        - image: { x: 12, y: 14, src: img_dayong }

        - button:
            id: tab_all_button
            x: 126
            y: 10
            width: 96
            height: 112
            styles: mono_button
            bg_color: 0xD8D8D8
            widgets: [ { image: { align: CENTER, src: img_tab_all } } ]
            on_click:
              - lambda: |-
                    const lv_color_t normal = lv_color_hex(id(theme_bg));
                    const lv_color_t selected = lv_color_hex(id(theme_selected));
                    lv_obj_set_style_bg_color(id(tab_all_button), selected, LV_PART_MAIN);
                    lv_obj_set_style_bg_color(id(tab_parents_button), normal, LV_PART_MAIN);
                    lv_obj_set_style_bg_color(id(tab_darren_button), normal, LV_PART_MAIN);
                    lv_obj_set_style_bg_color(id(tab_amber_button), normal, LV_PART_MAIN);
                    lv_obj_set_style_bg_color(id(tab_gas_button), normal, LV_PART_MAIN);
                    lv_obj_set_style_bg_color(id(tab_settings_button), normal, LV_PART_MAIN);
                    id(settings_open) = false;
                    lv_obj_add_flag(id(settings_panel), LV_OBJ_FLAG_HIDDEN);
              - homeassistant.event:
                  event: esphome.tab5_command
                  data: { action: "open_tab", tab: "all" }
        - button:
            id: tab_parents_button
            x: 222
            y: 10
            width: 96
            height: 112
            styles: mono_button
            widgets: [ { image: { align: CENTER, src: img_tab_papamama } } ]
            on_click:
              - lambda: |-
                    const lv_color_t normal = lv_color_hex(id(theme_bg));
                    const lv_color_t selected = lv_color_hex(id(theme_selected));
                    lv_obj_set_style_bg_color(id(tab_all_button), normal, LV_PART_MAIN);
                    lv_obj_set_style_bg_color(id(tab_parents_button), selected, LV_PART_MAIN);
                    lv_obj_set_style_bg_color(id(tab_darren_button), normal, LV_PART_MAIN);
                    lv_obj_set_style_bg_color(id(tab_amber_button), normal, LV_PART_MAIN);
                    lv_obj_set_style_bg_color(id(tab_gas_button), normal, LV_PART_MAIN);
                    lv_obj_set_style_bg_color(id(tab_settings_button), normal, LV_PART_MAIN);
                    id(settings_open) = false;
                    lv_obj_add_flag(id(settings_panel), LV_OBJ_FLAG_HIDDEN);
              - homeassistant.event:
                  event: esphome.tab5_command
                  data: { action: "open_tab", tab: "parents" }
        - button:
            id: tab_darren_button
            x: 318
            y: 10
            width: 96
            height: 112
            styles: mono_button
            widgets: [ { image: { align: CENTER, src: img_tab_darren } } ]
            on_click:
              - lambda: |-
                    const lv_color_t normal = lv_color_hex(id(theme_bg));
                    const lv_color_t selected = lv_color_hex(id(theme_selected));
                    lv_obj_set_style_bg_color(id(tab_all_button), normal, LV_PART_MAIN);
                    lv_obj_set_style_bg_color(id(tab_parents_button), normal, LV_PART_MAIN);
                    lv_obj_set_style_bg_color(id(tab_darren_button), selected, LV_PART_MAIN);
                    lv_obj_set_style_bg_color(id(tab_amber_button), normal, LV_PART_MAIN);
                    lv_obj_set_style_bg_color(id(tab_gas_button), normal, LV_PART_MAIN);
                    lv_obj_set_style_bg_color(id(tab_settings_button), normal, LV_PART_MAIN);
                    id(settings_open) = false;
                    lv_obj_add_flag(id(settings_panel), LV_OBJ_FLAG_HIDDEN);
              - homeassistant.event:
