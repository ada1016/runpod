substitutions:
  ac_brother: climate.280060372jia_daikin_ge
  ac_sister: climate.280060372jia_daikin_mei
  ac_parents: climate.280060372jia_daikin_ba_ma
  ac_living: climate.living_room_daikin_ke


# ===================================================
# ESPHOME
# ===================================================

esphome:
  name: tab5
  friendly_name: M5Stack Tab5


# ===================================================
# ESP32-P4
# ===================================================

esp32:
  variant: esp32p4
  flash_size: 16MB

  # Your Tab5 is ESP32-P4 rev1.0 / ECO2
  engineering_sample: true
  cpu_frequency: 360MHz

  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true


# ===================================================
# ESP32-C6 Wi-Fi coprocessor
# ===================================================

esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  slot: 1


# ===================================================
# LOGGER / PSRAM
# ===================================================

logger:
  hardware_uart: USB_SERIAL_JTAG

psram:
  mode: hex
  speed: 200MHz


# ===================================================
# TAB5 SYSTEM I2C
# ===================================================

i2c:
  - id: bsp_bus
    sda: GPIO31
    scl: GPIO32
    frequency: 400kHz
    scan: true


# ===================================================
# TAB5 I/O EXPANDERS
# ===================================================

pi4ioe5v6408:
  - id: pi4ioe1
    address: 0x43

  - id: pi4ioe2
    address: 0x44


# ===================================================
# ESP32-C6 Wi-Fi POWER
# ===================================================

switch:
  - platform: gpio
    id: wifi_power
    name: "WiFi Power"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 0
    restore_mode: ALWAYS_ON


# ===================================================
# NETWORK / HOME ASSISTANT
# ===================================================

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome


# ===================================================
# TAB5 DISPLAY POWER
# ===================================================

esp_ldo:
  - id: display_ldo
    voltage: 2.5V
    channel: 3


# ===================================================
# TAB5 LCD
# ===================================================

display:
  - platform: mipi_dsi
    id: tab5_display
    model: M5Stack-Tab5

    dimensions:
      width: 720
      height: 1280

    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 4

    show_test_card: false


# ===================================================
# TAB5 TOUCHSCREEN
# ===================================================

touchscreen:
  - platform: gt911
    id: tab5_touch
    i2c_id: bsp_bus
    interrupt_pin: GPIO23

    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 5

    update_interval: never

    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false

    calibration:
      x_min: 0
      x_max: 720
      y_min: 0
      y_max: 1280


# ===================================================
# HOME ASSISTANT AC MODE / FAN STATE
# ===================================================

text_sensor:

  # ---------------- DARREN ----------------

  - platform: homeassistant
    id: brother_state
    entity_id: ${ac_brother}
    on_value:
      then:
        - lvgl.label.update:
            id: brother_mode_label
            text: !lambda |-
              if (x == "off") return std::string("OFF");
              if (x == "cool") return std::string("COOL");
              if (x == "unavailable") return std::string("--");
              if (x == "unknown") return std::string("--");
              return x;

  - platform: homeassistant
    id: brother_fan
    entity_id: ${ac_brother}
    attribute: fan_mode
    on_value:
      then:
        - lvgl.label.update:
            id: brother_fan_label
            text: !lambda |-
              if (x.empty()) return std::string("--");
              return x;


  # ---------------- AMBER ----------------

  - platform: homeassistant
    id: sister_state
    entity_id: ${ac_sister}
    on_value:
      then:
        - lvgl.label.update:
            id: sister_mode_label
