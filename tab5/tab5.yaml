              if (x == "off") return std::string("OFF");
              if (x == "cool") return std::string("COOL");
              if (x == "unavailable") return std::string("--");
              if (x == "unknown") return std::string("--");
              return x;

  - platform: homeassistant
    id: sister_fan
    entity_id: ${ac_sister}
    attribute: fan_mode
    on_value:
      then:
        - lvgl.label.update:
            id: sister_fan_label
            text: !lambda |-
              if (x.empty()) return std::string("--");
              return x;


  # ---------------- PA & MOM ----------------

  - platform: homeassistant
    id: parents_state
    entity_id: ${ac_parents}
    on_value:
      then:
        - lvgl.label.update:
            id: parents_mode_label
            text: !lambda |-
              if (x == "off") return std::string("OFF");
              if (x == "cool") return std::string("COOL");
              if (x == "unavailable") return std::string("--");
              if (x == "unknown") return std::string("--");
              return x;

  - platform: homeassistant
    id: parents_fan
    entity_id: ${ac_parents}
    attribute: fan_mode
    on_value:
      then:
        - lvgl.label.update:
            id: parents_fan_label
